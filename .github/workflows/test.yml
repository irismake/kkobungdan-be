name: Test

on:
  pull_request:
    branches:
      - staging
      - main

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (static + tests)
    runs-on: ubuntu-latest

    services:
      # docker-compose.test.yml 의 mysql-test 와 같은 설정
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: orderrun_test
          MYSQL_USER: orderrun_user
          MYSQL_PASSWORD: orderrun_pass
          TZ: UTC
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u orderrun_user -porderrun_pass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_USERNAME: orderrun_user
      DB_PASSWORD: orderrun_pass
      DB_NAME: orderrun_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run verify.sh
        run: bash scripts/verify.sh all
