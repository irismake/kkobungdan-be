name: Staging Deploy

# staging 머지(push)와 수동 실행에서 배포 전에 CI(.github/workflows/test.yml)를 workflow_call로 먼저 돌리고,
# 성공했을 때만 check → build → deploy를 진행한다. CI가 실패하거나 취소되면 배포하지 않는다.
# 수동 실행의 skip_ci는 긴급 복구용이다. 켜면 CI를 건너뛰고 바로 배포한다.
on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      skip_ci:
        description: "CI를 건너뛰고 바로 배포한다 (긴급 복구용)"
        type: boolean
        default: false

# 배포가 겹치지 않게 한 번에 하나만 실행한다. 진행 중인 배포는 끊지 않는다(마이그레이션이 중간에 끊기지 않게).
concurrency:
  group: staging-deploy
  cancel-in-progress: false

env:
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/orderrun
  DOCKER_IMAGE_TAG: staging
  DOCKER_IMAGE_SHA_TAG: staging-${{ github.sha }}

jobs:
  ci:
    name: CI
    # push는 항상, 수동 실행은 skip_ci를 켜지 않았을 때 실행한다.
    if: github.event_name == 'push' || inputs.skip_ci != true
    uses: ./.github/workflows/test.yml

  # `main` → `staging` 동기화(AGENTS.md "브랜치 동기화 규칙")는 squash merge 직후
  # `staging`을 `main`으로 reset해 force push한다. 이 push는 새 내용이 없는데도
  # `push: staging` 트리거를 때려, 방금 프로덕션에 나간 것과 같은 내용을 스테이징에
  # 다시 배포한다. reset은 커밋을 만들지 않아 `[skip ci]`를 넣을 자리도 없고,
  # 그 커밋은 곧 프로덕션 배포를 트리거하는 커밋이라 거기에 넣을 수도 없다.
  #
  # 그래서 "이 커밋이 이미 main에 있는가"로 판정한다. 동기화 push일 때만 참이 되고,
  # 기능이 쌓이는 동안에는 staging에 main에 없는 커밋이 있어 정상 배포된다.
  check:
    name: Check if deploy is needed
    runs-on: ubuntu-latest
    needs: ci
    # CI가 성공했거나, 수동 실행에서 skip_ci로 CI를 건너뛴 경우에만 진행한다. 실패·취소면 여기서 멈춘다.
    if: >-
      always() && (
        needs.ci.result == 'success' ||
        (needs.ci.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.skip_ci == true)
      )
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        run: |
          # 수동 실행은 항상 배포한다. 배포가 중간에 깨져 같은 내용을 다시 올려야 하는
          # 복구 상황(2026-08-27)이 바로 이 경로이고, 그때 가드가 막으면 안 된다.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.skip_ci }}" = "true" ]; then
              echo "::warning title=CI 생략::긴급 복구용으로 CI를 건너뛰고 배포한다."
            fi
            echo "수동 실행이므로 배포한다."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin main
          if git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "이 커밋은 이미 main에 있다 (main → staging 동기화 push). 배포를 건너뛴다."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "main에 없는 커밋이 있다. 배포한다."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: check
    # CI Job이 건너뛰어진 경우(skip_ci)에도 이어지도록 always()로 직접 판정한다.
    if: always() && needs.check.result == 'success' && needs.check.outputs.should_deploy == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}
            ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_SHA_TAG }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:staging-buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:staging-buildcache,mode=max
          platforms: linux/amd64

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.docker_build.outputs.digest }}"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: always() && needs.build.result == 'success'
    environment: staging
    # 마이그레이션이 락에 걸려도 러너가 몇 시간씩 매달리지 않게 한다.
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STG_EC2_SSH_KEY }}" | base64 -d > ~/.ssh/staging.pem
          chmod 600 ~/.ssh/staging.pem
          ssh-keyscan -H "${{ secrets.STG_EC2_HOST }}" >> ~/.ssh/known_hosts

          # 마이그레이션처럼 원격 명령이 오래 조용한 동안 세션이 broken pipe로 죽지 않게 한다.
          # 끊기면 진짜 실패 사유가 로그에 안 남는다(2026-08-27 배포).
          cat >> ~/.ssh/config << 'SSHCFG'
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 6
          SSHCFG
          chmod 600 ~/.ssh/config

      - name: Create deployment directory on EC2
        run: |
          ssh -i ~/.ssh/staging.pem "${{ secrets.STG_EC2_USERNAME }}@${{ secrets.STG_EC2_HOST }}" << 'EOF'
            mkdir -p ~/orderrun
          EOF

      - name: Copy deployment files to EC2
        run: |
          scp -i ~/.ssh/staging.pem \
            docker-compose.ec2.yml \
            "${{ secrets.STG_EC2_USERNAME }}@${{ secrets.STG_EC2_HOST }}:~/orderrun/"

          scp -i ~/.ssh/staging.pem \
            scripts/deploy.sh \
            scripts/install-logrotate.sh \
            scripts/staging-smoke-test.sh \
            "${{ secrets.STG_EC2_USERNAME }}@${{ secrets.STG_EC2_HOST }}:~/orderrun/"

          scp -i ~/.ssh/staging.pem -r \
            nginx \
            "${{ secrets.STG_EC2_USERNAME }}@${{ secrets.STG_EC2_HOST }}:~/orderrun/"

      - name: Deploy application
        run: |
          ssh -i ~/.ssh/staging.pem "${{ secrets.STG_EC2_USERNAME }}@${{ secrets.STG_EC2_HOST }}" << 'EOF'
            set -euo pipefail

            cd ~/orderrun

            # NGINX_TEMPLATE을 덮어쓰지 않는다. 예전에는 HTTP 전용 템플릿을 하드코딩해서
            # 디스크 설정과 실행 중인 nginx 설정이 어긋나 있었고, nginx가 재생성되는
            # 순간 staging HTTPS가 사라지는 상태였다.
            existing_nginx_template="$(grep -E '^NGINX_TEMPLATE=' .env.ec2 2>/dev/null | cut -d= -f2- || true)"
            if [ -z "$existing_nginx_template" ]; then
              existing_nginx_template=./nginx/templates/ec2-https.conf.template
            fi

            # staging API 문서용 basic auth 자격증명. 저장소에 두지 않는다.
            # auth_basic_user_file은 root master가 아니라 worker(nginx, uid 101)가 요청마다 연다.
            # ubuntu 소유 600이면 worker가 못 읽어 /docs가 500이 되므로 root:101 640으로 둔다.
            # 파일을 교체하지 않고 제자리에서 덮어쓴다. 단일 파일 bind mount는 inode에 묶여 있어서
            # 교체하면 재생성되지 않은 nginx 컨테이너가 예전 내용을 계속 본다.
            # 권한부터 좁힌 뒤 내용을 쓴다.
            sudo touch nginx/htpasswd
            sudo chown root:101 nginx/htpasswd
            sudo chmod 640 nginx/htpasswd
            printf '%s\n' '${{ secrets.DOCS_BASIC_AUTH_HTPASSWD }}' | sudo tee nginx/htpasswd > /dev/null

            # Secret이 담긴 env 파일은 소유자만 읽게 한다. 기존 파일이 664로 남아 있어도
            # 값을 쓰기 전에 권한부터 좁힌다(`cat >`는 기존 파일의 권한을 그대로 둔다).
            umask 077
            : > .env.ec2
            chmod 600 .env.ec2
            cat > .env.ec2 << 'ENVEOF'
          DOCKER_IMAGE=${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}
          EC2_PUBLIC_IP=${{ secrets.STG_EC2_HOST }}
          PROD_DOMAIN=api.kkobung-dan.store
          STAGING_DOMAIN=staging-api.kkobung-dan.store
          NGINX_TEMPLATE=__NGINX_TEMPLATE__
          SERVER_HOST=0.0.0.0
          SERVER_PORT=8000
          STAGING_APP_ENV=staging
          STAGING_APP_DEBUG=false
          STAGING_SECRET_KEY=${{ secrets.STG_JWT_SECRET }}
          STAGING_JWT_SECRET=${{ secrets.STG_JWT_SECRET }}
          STAGING_MYSQL_HOST=${{ secrets.STG_MYSQL_HOST }}
          STAGING_MYSQL_PORT=${{ secrets.STG_MYSQL_PORT }}
          STAGING_MYSQL_USER=${{ secrets.STG_MYSQL_USER }}
          STAGING_MYSQL_PASSWORD=${{ secrets.STG_MYSQL_PASSWORD }}
          STAGING_MYSQL_DATABASE=${{ secrets.STG_MYSQL_DATABASE }}
          STAGING_AWS_SNS_REGION=${{ secrets.AWS_SNS_REGION }}
          STAGING_AWS_SNS_ACCESS_KEY_ID=${{ secrets.AWS_SNS_ACCESS_KEY_ID }}
          STAGING_AWS_SNS_SECRET_ACCESS_KEY=${{ secrets.AWS_SNS_SECRET_ACCESS_KEY }}
          STAGING_AWS_SNS_SMS_SENDER_ID=Kkobongdan
          STAGING_AWS_SNS_SMS_TYPE=Transactional
          STAGING_FCM_CREDENTIALS_PATH=/app/keys/orderrun-firebase-key.json
          STAGING_ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          STAGING_ADMIN_INITIAL_PASSWORD=${{ secrets.ADMIN_INITIAL_PASSWORD }}
          STAGING_CORS_ALLOW_ORIGINS=http://localhost:5173
          STAGING_ADMIN_ALERT_SLACK_WEBHOOK_URL=${{ secrets.STG_ADMIN_ALERT_SLACK_WEBHOOK_URL }}
          STAGING_ADMIN_WEB_BASE_URL=http://localhost:5173
          PROD_APP_ENV=production
          PROD_APP_DEBUG=false
          PROD_SECRET_KEY=prod-not-configured
          PROD_JWT_SECRET=prod-not-configured
          PROD_MYSQL_HOST=prod-not-configured
          PROD_MYSQL_PORT=3306
          PROD_MYSQL_USER=prod-not-configured
          PROD_MYSQL_PASSWORD=prod-not-configured
          PROD_MYSQL_DATABASE=prod_orderun
          PROD_AWS_SNS_REGION=${{ secrets.AWS_SNS_REGION }}
          PROD_AWS_SNS_ACCESS_KEY_ID=${{ secrets.AWS_SNS_ACCESS_KEY_ID }}
          PROD_AWS_SNS_SECRET_ACCESS_KEY=${{ secrets.AWS_SNS_SECRET_ACCESS_KEY }}
          PROD_AWS_SNS_SMS_SENDER_ID=Kkobongdan
          PROD_AWS_SNS_SMS_TYPE=Transactional
          PROD_FCM_CREDENTIALS_PATH=/app/keys/orderrun-firebase-key.json
          PROD_CORS_ALLOW_ORIGINS=https://order-run-fe.vercel.app
          LETSENCRYPT_EMAIL=admin@example.com
          ENVEOF
            sed -i.bak "s#__NGINX_TEMPLATE__#${existing_nginx_template}#" .env.ec2
            # 백업본에도 모든 Secret이 들어 있다. 쓰는 곳이 없으므로 남기지 않는다.
            rm -f .env.ec2.bak

            chmod +x deploy.sh install-logrotate.sh staging-smoke-test.sh

            existing_staging_service="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.service" }}' orderrun-app-staging 2>/dev/null || true)"
            if [ "$existing_staging_service" = "app" ]; then
              docker rm -f orderrun-app-staging orderrun-nginx-staging orderrun-redis-staging || true
            fi

            COMPOSE_FILE=docker-compose.ec2.yml COMPOSE_ENV_FILE=.env.ec2 DEPLOY_TARGET=staging ./deploy.sh
            if [ "$(docker inspect -f '{{.State.Running}}' orderrun-nginx 2>/dev/null || echo false)" != "true" ]; then
              docker compose --env-file .env.ec2 -f docker-compose.ec2.yml up -d --build nginx
            fi
          EOF

      - name: Verify deployment
        run: |
          sleep 30
          curl -f "http://${{ secrets.STG_EC2_HOST }}/v1/health" || exit 1
          curl -f "http://staging-api.kkobung-dan.store/v1/health" || exit 1
          ssh -i ~/.ssh/staging.pem "${{ secrets.STG_EC2_USERNAME }}@${{ secrets.STG_EC2_HOST }}" << 'EOF'
            cd ~/orderrun
            BASE_URL=http://localhost ./staging-smoke-test.sh
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/staging.pem

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deployment successful to staging environment"
          else
            echo "Deployment failed"
            exit 1
          fi
