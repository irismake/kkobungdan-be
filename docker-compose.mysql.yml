# EC2 내부 MySQL. 앱 배포(GitHub Actions)와 수명주기를 분리하려고 별도 compose 프로젝트로 둔다.
# 앱 compose(orderrun)에 넣으면 브랜치마다 다른 compose 파일이 번갈아 깔리면서 `up --remove-orphans`가
# DB 컨테이너를 지울 수 있다. 워크플로는 이 파일을 복사하지 않는다. EC2의 ~/orderrun-db/ 에 수동 배치한다.
#
#   cd ~/orderrun-db && docker compose -f docker-compose.mysql.yml up -d
#
# 네트워크와 볼륨은 사전에 수동으로 만든다. 어느 compose 프로젝트의 `down -v`로도 지워지지 않게 하기 위해서다.
#   docker network create --driver bridge --internal --subnet 192.168.100.0/24 orderrun-db-network
#   docker volume create orderrun-mysql-data
name: orderrun-db

services:
  mysql:
    # RDS와 같은 버전으로 고정한다. 이전 작업의 덤프 클라이언트도 이 태그를 쓴다.
    image: mysql:8.4.8
    container_name: orderrun-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      # 공식 이미지는 기본으로 root@'%'도 만든다. 컨테이너 내부 소켓 접속만 허용한다.
      MYSQL_ROOT_HOST: localhost
      TZ: UTC
    secrets:
      - mysql_root_password
      - mysql_root_cnf
      - mysql_backup_cnf
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    # ports: 를 두지 않는다. Docker가 게시한 포트는 ufw 규칙을 우회한다.
    networks:
      - db
    healthcheck:
      # 자격증명 없이 ping하면 매번 인증 실패로 Aborted_connects가 쌓여 실제 인증 실패를 가린다.
      test: ["CMD", "mysqladmin", "--defaults-extra-file=/run/secrets/mysql_root_cnf", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    # 기본값(10초 후 SIGKILL)이면 종료 때마다 InnoDB 크래시 복구를 탄다.
    stop_grace_period: 60s
    # t3.micro에서 MySQL이 앱 메모리까지 잡아먹지 않게 상한을 둔다. 경량 설정 기준 실사용은 이보다 한참 작다.
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  db:
    name: orderrun-db-network
    external: true

volumes:
  mysql-data:
    name: orderrun-mysql-data
    external: true

# 파일은 ~/orderrun-db/secrets/ (700) 아래 600 권한으로 둔다. 저장소에는 없다.
secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password
  mysql_root_cnf:
    file: ./secrets/root.cnf
  mysql_backup_cnf:
    file: ./secrets/backup.cnf
